{% extends "base.html" %}

{% block content %}
<h2>Удаление привычки</h2>
<p>Вы уверены, что хотите удалить привычку "{{ habit.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'habits:habit_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
