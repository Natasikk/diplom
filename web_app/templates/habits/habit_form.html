{% extends "base.html" %}

{% block content %}
<h2>{{ title }}</h2>
<form method="post">
    {% csrf_token %}
    
    {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger">{{ field.errors }}</div>
            {% endif %}
        </div>
    {% endfor %}
    
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'habits:habit_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
