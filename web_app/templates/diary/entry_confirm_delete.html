{% extends "base.html" %}

{% block content %}
<h2>Удаление записи</h2>
<p>Вы уверены, что хотите удалить запись "{{ entry.title }}" от {{ entry.date|date:"d.m.Y" }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'diary:entry_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
